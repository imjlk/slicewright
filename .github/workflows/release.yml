name: Release

# Sampo release automation, after CI passes on main:
# - with pending changesets in .sampo/changesets, it opens or updates the
#   release PR (release/main) that bumps package.json and CHANGELOG.md;
# - when that PR has merged, it publishes to npm through Trusted Publishing
#   (OIDC, no token) the dist the build job checked and built, and creates the
#   v<version> tag and GitHub release.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Several merges in a row each finish CI; only the run for the current main
  # tip releases, so a stale run ends here instead of racing.
  preflight:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      current: ${{ steps.current.outputs.current }}
      sha: ${{ steps.current.outputs.sha }}
    steps:
      - name: Release commit is current main
        id: current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          echo "sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          if [ "${main_sha}" != "${RELEASE_SHA}" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping ${RELEASE_SHA}: main is at ${main_sha}, whose run releases instead."
            exit 0
          fi
          # A manual run needs CI to have passed on this commit.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            conclusion="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml --commit "${RELEASE_SHA}" --event push --limit 5 --json status,conclusion --jq '[.[] | select(.status == "completed")][0].conclusion // empty')"
            if [ "${conclusion}" != "success" ]; then
              echo "Manual release needs a successful CI push run for ${RELEASE_SHA}; got ${conclusion:-none}." >&2
              exit 1
            fi
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

  # Builds and checks without any write permission: dependency install scripts
  # and the build never see the publish token.
  build:
    needs: preflight
    if: ${{ needs.preflight.outputs.current == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache compiled ttsc plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/ttsc/plugins
          key: ${{ runner.os }}-${{ runner.arch }}-ttsc-plugins-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-ttsc-plugins-

      # What prepublishOnly runs for a manual publish.
      - run: pnpm check && pnpm test && pnpm build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [preflight, build]
    if: ${{ needs.preflight.outputs.current == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # pnpm publish checks the branch and a clean tree; attach the verified
      # commit to main and track origin/main.
      - name: Attach the release commit to main
        run: |
          git switch -C main
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git branch --set-upstream-to=origin/main main

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      # Trusted Publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11.20.0

      # No install scripts here: this job can mint the publish token.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Verify the built package
        run: test -f dist/cli.js && test -f dist/index.js && test -f dist/index.d.ts

      # Credentials stay out of checkout and install; Sampo's git push reads
      # the step-scoped token through the helper.
      - name: Configure git authentication for Sampo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth setup-git --hostname github.com

      # The build job already checked and built dist, so publishing skips
      # prepublishOnly rather than rebuilding with install scripts disabled.
      - name: Run Sampo release automation
        uses: bruits/sampo/crates/sampo-github-action@f7241754458e1be4073902b2860596340c7d089c # sampo-v0.17.4
        with:
          command: auto
          create-github-release: true
          npm-args: --ignore-scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A PR opened with GITHUB_TOKEN does not start CI on its own.
      - name: Run CI on the release PR
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head release/main --state open --json number --jq '.[0].number // empty')"
          if [ -n "${release_pr}" ]; then
            gh workflow run ci.yml --ref release/main
          else
            echo "No open release PR."
          fi
