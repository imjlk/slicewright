name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs CI on the release PR, which GITHUB_TOKEN cannot trigger.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: check
            os: ubuntu-latest
          - name: check (Windows)
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache compiled ttsc plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/ttsc/plugins
          key: ${{ runner.os }}-${{ runner.arch }}-ttsc-plugins-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-ttsc-plugins-

      # Type check, @ttsc/lint, format, and the @ttsc/evidence spec graph in one pass.
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      # Installs the packed public API in a clean project and drives the same
      # HTML/CSS and Canvas scenarios with real browser input.
      - run: pnpm browser:check
      - run: pnpm playwright:check
      - name: Upload browser verification artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-verification-${{ runner.os }}
          path: |
            .slicewright/browser-e2e/
            .slicewright/playwright-e2e/
          if-no-files-found: ignore
      # Renders examples/real as Phaser 4 NineSlices and CSS border-images in
      # the runner's Chrome and compares them with slicewright's renderer.
      - run: pnpm engine:check
      # A separate sheet keeps the WebGL canvas below common 8192px limits.
      - run: pnpm engine:check --manifest examples/content-preview/manifest.json
